<!doctype html>
<html lang="en" data-rc="today">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roof Command</title>
<script src="../lib/rc-frame-pause.js"></script><!-- parked by the shell = no drawing -->
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preload" href="fonts/montserrat-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/montserrat-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../vendor/maplibre-gl@4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="dk.css">
<link rel="stylesheet" href="features.css">
<link rel="stylesheet" href="../lib/rc-physical.css">
<script>try{ if (window.self !== window.top) document.documentElement.classList.add('embed'); }catch(e){ document.documentElement.classList.add('embed'); }</script>
<style>
.app{--g:28px;height:100vh;height:100dvh;display:grid;grid-template-rows:64px auto minmax(0,1fr);overflow:hidden}
.head{display:flex;align-items:flex-end;gap:28px;padding:24px var(--g) 20px}
.hello{min-width:0;flex:1 1 auto}
.hello h1{font-weight:400;font-size:42px;letter-spacing:-.035em;line-height:1.02;color:#3A4152}
.hello h1 b{font-weight:600;color:var(--ink)}
.hello p{margin-top:8px;color:var(--muted);font-size:14.5px;max-width:640px;line-height:1.5;text-wrap:pretty}
.hello p strong{color:var(--ink);font-weight:600}
.head .sp{flex:0 1 0}
.today{display:flex;align-items:center;gap:22px;flex:none}
.tstat{display:grid;gap:10px}
.tstat div{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.tstat .tcalled{display:none}   /* the ring is the one "reached" count on a desktop */
.tstat b{font-size:20px;color:var(--ink);font-weight:700;letter-spacing:-.02em;min-width:26px;text-align:right}

.main{display:grid;grid-template-columns:288px minmax(420px,520px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:22px;padding:0 var(--g) 22px;min-height:0}
/* queue */
.queue{background:var(--panel);box-shadow:var(--shadow-soft);border:1px solid var(--hair-2);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.qh{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 10px}
.qh b{font-size:14px;font-weight:700}
.qh small{color:var(--muted);font-size:12px}
.qlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--panel-3) transparent;padding:0 8px 8px;display:grid;gap:2px;align-content:start}
.qlist.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.qrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;text-align:left;transition:background .2s}
.qrow:hover{background:var(--panel-2)}
.qrow .no{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.qrow .ad{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.qrow .mt{font-size:11.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .hz{font-size:12px;font-weight:700;color:var(--ink-2)}
.qrow.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.qrow.on .no{background:var(--accent);border-color:var(--accent);color:#fff}
.qrow.on .mt{color:var(--slate)}
.qrow.on .hz{color:var(--accent-ink)}
.qrow.done{opacity:.45}
.qrow.done .no{background:var(--panel-2);border-color:transparent}
.qfoot{flex:none;padding:12px 18px;border-top:1px solid var(--hair-2);font-size:12px;color:var(--muted)}

/* deck */
.deck{position:relative;min-height:0;--dir:-1}
.card{position:absolute;inset:0 0 44px 0;transform-origin:50% 100%;display:flex;flex-direction:column;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s cubic-bezier(.2,.8,.2,1),box-shadow .5s;touch-action:pan-y;user-select:none}
.card[data-d="1"]{transform:translateY(14px) scale(.955);z-index:2;box-shadow:0 1px 2px rgba(11,16,32,.05),0 10px 24px -12px rgba(11,16,32,.14)}
.card[data-d="2"]{transform:translateY(28px) scale(.91);z-index:1;box-shadow:0 1px 2px rgba(11,16,32,.04)}
.card[data-d="0"]{z-index:3}
.card[data-d="1"] > *,.card[data-d="2"] > *{opacity:0;transition:opacity .25s}
.card[data-d="1"]{background:#F4F5F8}.card[data-d="2"]{background:#E2E5EB}
.card[data-d="3"]{opacity:0;transform:translateY(30px) scale(.9);z-index:0}
.card.out{transform:translateX(calc(var(--dir) * 120%)) rotate(calc(var(--dir) * 9deg))!important;opacity:0}
.card.drag{transition:none}
.ph{position:relative;height:216px;flex:1 1 216px;min-height:118px;max-height:340px;overflow:hidden;border-radius:20px 20px 0 0;background:#E9ECF1}
.ph .tl{position:absolute;left:14px;top:14px;display:flex;gap:6px}
.ph .tr{position:absolute;right:14px;top:14px}
.ph .bl{position:absolute;left:14px;bottom:10px;font-size:10.5px;color:var(--muted)}
.ph .ex{position:absolute;right:12px;bottom:10px;height:30px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--ink);font-size:11.5px;font-weight:600;display:none;align-items:center;gap:6px;box-shadow:var(--shadow-soft)}
.ph .ex .ic{width:13px;height:13px}
.cb{padding:20px 24px 0;display:flex;flex-direction:column;flex:0 0 auto}
.cb .act{margin-top:18px}
.addr{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.addr h2{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.addr p{color:var(--slate);font-size:13.5px;margin-top:5px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border:1px solid var(--rule);border-radius:14px}
.facts div{padding:12px 14px;min-width:0}
.facts div+div{border-left:1px solid var(--rule)}
.facts small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--slate);font-weight:500;white-space:nowrap}
.facts small .ic{width:14px;height:14px}
.facts b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:5px;white-space:nowrap}
.facts b i{display:block;font-style:normal;font-size:12px;font-weight:500;color:var(--slate);margin:2px 0 0;white-space:normal;line-height:1.25}
.why{margin-top:14px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.why b{color:var(--ink);font-weight:700}
.calls{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.act{padding:8px;display:flex;gap:8px;background:var(--panel-2);border:1px solid var(--hair-2);margin:auto 0 16px;border-radius:16px}
.act button{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:15px;color:var(--ink);transition:transform .15s cubic-bezier(.2,.8,.2,1),background .2s,box-shadow .2s}
.act button:active{transform:scale(.96)}
.act .pri{flex:1.6;background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.act .pri:hover{background:var(--accent-hi);box-shadow:0 10px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.act .txt{flex:1;background:#fff;border:1px solid var(--hair)}
.act .txt:hover{border-color:var(--edge)}
.act .skp{flex:.8;background:transparent;color:var(--muted)}
.act .skp:hover{background:rgba(11,16,32,.05);color:var(--ink)}
.act .prf{flex:.9}
.act .ic{width:19px;height:19px}

/* map */
.mapwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--hair-2);box-shadow:var(--shadow-soft);background:#E4E7EC;min-height:0}
#map{position:absolute;inset:0}
.mtag{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:2;flex-wrap:wrap;right:14px}
.mtag .pill{background:#fff;color:var(--ink);box-shadow:var(--shadow-soft)}
.mtag .pill.dk{background:var(--ink);color:#fff}
/* first paint: the greeting never shows a bare comma (the rep name lands with the profile), and the message count is a
   shimmer bar until the list is built, not the word Loading */
#hello .rep:not(:empty)::before{content:", "}
#hello::after{content:"."}
.mtag .pill.skel:empty{display:inline-block;min-width:168px;min-height:1.15em;border-radius:999px;background:linear-gradient(90deg,#EEF0F4 25%,#FAFBFC 50%,#EEF0F4 75%);background-size:200% 100%;animation:skel 1.3s linear infinite;box-shadow:none}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.mtag .pill.skel:empty{animation:none}}
.mnext{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--shadow-soft);padding:12px 14px;display:flex;align-items:center;gap:12px}
.mnext .th{width:56px;height:42px;border-radius:9px;overflow:hidden;flex:none;background:#E9ECF1}
.mnext .th{box-sizing:border-box;padding:4px;background:radial-gradient(ellipse 80% 90% at 50% 40%,#fff 0%,#EEF1F5 100%)}
.mnext .th svg{width:100%;height:100%;display:block}   /* the whole roof, fitted, not a cropped corner */
.mnext > div{min-width:0}
.mnext b{font-size:13.5px;display:block;line-height:1.3}
.mnext small{font-size:12px;color:var(--slate);display:block;line-height:1.35;margin-top:1px}
.mnext .go{margin-left:auto;height:36px;padding:0 14px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;flex:none}
.mnext .go .ic{width:16px;height:16px}

/* pipeline strip */
.pipe{display:flex;align-items:stretch;gap:0;margin:0 var(--g) 10px;border:1px solid var(--hair-2);border-radius:16px;background:var(--panel);box-shadow:var(--shadow-soft);overflow:hidden}
.pipe .lead{padding:12px 20px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--hair-2);flex:0 0 300px;min-width:0}
.pipe .lead b{font-size:13.5px}
.pipe .lead small{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35;text-wrap:balance}
.stg{flex:1 1 0;min-width:0;padding:14px 18px;display:flex;align-items:center;gap:12px;position:relative;text-align:left;transition:background .2s}
.stg:hover{background:var(--panel-2)}
.stg + .stg::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:1px;background:var(--hair-2)}
.stg .c{font-size:22px;font-weight:700;letter-spacing:-.03em}
.stg .l{font-size:12.5px;color:var(--muted);line-height:1.25;min-width:0}
.stg .bar2{position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--panel-2)}
.stg .bar2 i{display:block;height:100%;border-radius:inherit;background:#AEB4C2}
.stg.on{background:var(--panel-2)}
.stg.on .bar2 i{background:var(--accent)}
.stg.on .l{color:var(--ink);font-weight:600}

/* 1200 to 1366 desktops: everything stays, tighter */
@media (max-width:1380px){
  .bar{gap:14px;padding:0 22px}
  .tabs{margin-left:10px}.tabs button{padding:7px 12px;font-size:13px}
  .find{width:150px}
  .app{--g:22px}
  .head{padding:18px var(--g) 16px;gap:18px}
  .hello h1{font-size:36px}.hello p{font-size:13.5px}
  .today{gap:18px}
  .ring{width:80px;height:80px}.ring .v b{font-size:22px}
  .main{grid-template-columns:256px minmax(380px,440px) minmax(0,1fr);gap:16px;padding:0 var(--g) 16px}
  .qrow{gap:10px;padding:8px 8px}.qrow .ad{font-size:13px}.qrow .hz{font-size:11.5px}
  .ph{height:188px}.cb{padding:16px 20px 0}.addr h2{font-size:24px}
  .facts{margin-top:14px}.facts div{padding:10px 12px}.facts b{font-size:18px}
  .why{margin-top:10px;font-size:13px}
  .act{margin:auto 0 14px}.act button{height:46px;font-size:14px}
  .pipe{margin:0 var(--g) 8px}.pipe .lead{flex-basis:250px;padding:10px 16px}.stg{padding:12px 14px;gap:10px}.stg .c{font-size:20px}
}
@media (max-height:820px){
  .head{padding-top:14px;padding-bottom:12px}
  .hello h1{font-size:32px}.hello p{margin-top:5px}
  .ring{width:76px;height:76px}.ring .v b{font-size:20px}.ring .v small{font-size:11px}
  .tstat{gap:6px}.tstat b{font-size:18px}
  .ph{height:170px}.facts b{font-size:17px}.why{line-height:1.45}
  .pipe{margin-bottom:8px}.stg{padding:10px 14px}.stg .c{font-size:19px}.pipe .lead{padding:8px 16px}
  .qrow{padding:7px 8px}
}

/* phone: designed for the truck */
.pbar,.peek,.sheet,.scrim,.rsheet{display:none}
@media (max-width:640px){
  .app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .bar{height:auto;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;gap:10px;flex:none}
  .tabs,.find,.sig,.me{display:none}
  .co .mk{width:34px;height:34px}
  .co b{font-size:14.5px}.co small{font-size:11.5px}
  .pbar{display:flex;align-items:center;gap:10px;margin-left:auto}
  .pbar .ring{width:48px;height:48px}
  .pbar .ring .disc{inset:6px}
  .pbar .ring .v b{font-size:14px}
  .pbar .ring .v small{display:none}
  .pbar .lbl{font-size:11px;color:var(--muted);text-align:right;line-height:1.25}
  .pbar .lbl b{color:var(--ink);display:block;font-size:13px;font-weight:700}
  .head{padding:10px 16px 6px;display:block;flex:none;order:1}
  .hello h1{font-size:25px}
  .hello p{font-size:12.5px;margin-top:3px;line-height:1.4}
  /* stats stay on the phone: one compact line under the greeting */
  .today{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair-2)}
  .today #ringL{display:none}
  .tstat{display:flex;gap:16px}.tstat div{font-size:12px;gap:5px}.tstat b{font-size:15px;min-width:0;text-align:left}
  .main{display:block;padding:0 14px;flex:1;min-height:0}
  .queue,.mapwrap{display:none}
  .deck{height:100%}
  .card{inset:0 0 24px 0;border-radius:22px}
  .card[data-d="1"]{transform:translateY(9px) scale(.96)}
  .card[data-d="2"]{transform:translateY(17px) scale(.92)}
  .ph{height:40%;min-height:160px;border-radius:22px 22px 0 0}
  .ph .bl{display:none}.ph .ex{display:inline-flex}
  .cb{padding:14px 16px 0}
  .addr h2{font-size:22px}
  .addr p{font-size:12.5px;margin-top:3px}
  .facts{margin-top:12px}
  .facts div{padding:9px 10px}
  .facts b{font-size:17px}
  .facts b i{font-size:11px}
  .why{font-size:12.5px;margin-top:10px;line-height:1.45}
  .calls{margin-top:8px;gap:6px}
  .act{margin:auto 0 12px;padding:8px}
  .act button{height:58px;font-size:16px}
  .act .skp{flex:.7}
  .pipe,.hint{display:none}
  /* peek bar + sheets */
  .peek{display:flex;align-items:center;gap:10px;flex:none;margin:0 14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px -14px rgba(11,16,32,.3);border:1px solid var(--hair-2);border-bottom:0}
  .peek .grab{position:absolute;left:50%;top:5px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--panel-3)}
  .peek{position:relative;padding-top:14px}
  /* icon + label on one line, the count on its own line under it (three chips in 362px cannot hold "Map 0 of 50 sent" across) */
  .peek button{min-height:48px;border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:1px 7px;font-size:13.5px;font-weight:600;line-height:1.15;padding:5px 8px;background:var(--panel-2);flex:1 1 0;min-width:0;justify-content:center;white-space:nowrap}
  .peek button .ic{width:16px;height:16px;color:var(--blue)}
  .peek button small{flex:0 0 100%;text-align:center;font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  .peek button small:empty{display:none}
  .sheet,.scrim{display:flex}
  .sheet .pmap{position:relative;height:58dvh;margin:0 14px 14px;border-radius:16px;overflow:hidden;border:1px solid var(--hair-2)}
  .sheet .pmap #map{position:absolute;inset:0}
  .sheet .mtag{left:10px;top:10px;right:10px}
  .sheet .mnext{left:10px;right:10px;bottom:10px}
  .sheet .mnext .go span:last-child{display:none}.sheet .mnext .go{padding:0 12px}
  .sheet .pipe{display:grid;margin:0 14px 16px;box-shadow:none}
  .sheet .pipe .lead{border-right:0;border-bottom:1px solid var(--hair-2);padding:12px 16px}
  .sheet .stg{padding:12px 16px;justify-content:space-between;flex-direction:row-reverse}
  .sheet .stg + .stg::before{display:none}
  .sheet .stg .bar2{left:16px;right:16px}
  .rsheet{display:flex}
  .rsheet .roofwrap{height:52vw;max-height:300px;margin:0 14px;border-radius:16px}
  .rsheet .rchips{padding:12px 14px 4px}
  .rsheet .rtab{padding:6px 14px 14px;font-size:13px}
  .rsheet .rtab table{width:100%;border-collapse:collapse}
  .rsheet .rtab td{padding:8px 0;border-top:1px solid var(--rule)}
  .rsheet .rtab td:last-child,.rsheet .rtab td:nth-child(3){text-align:right;font-weight:600;white-space:nowrap}
  .rsheet .rtab tr.sel td{color:var(--accent-ink);font-weight:700}
  .rsheet .rtab tfoot td{font-weight:700;border-top:2px solid var(--ink)}
  .rsheet .rtab p{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .main{order:3}.peek{order:4}
  .ph .bl{display:inline-flex}
}

/* round 4: plated roof art (Home screen language) */
.ph{background:radial-gradient(ellipse 70% 80% at 50% 38%,#FFFFFF 0%,#F3F5F8 45%,#E3E7EE 100%)}
.ph .rlink{position:absolute;inset:0;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ph .rlink::before{content:"";position:absolute;left:8%;right:8%;bottom:-6%;height:34%;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(11,16,32,.16),rgba(11,16,32,.05) 55%,transparent 72%);pointer-events:none}
.ph .rlink svg{position:relative}
.ph .rlink svg{width:100%;height:100%;display:block;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s cubic-bezier(.2,.8,.2,1)}
.ph .rlink:hover svg{transform:translateY(-3px) scale(1.025);filter:drop-shadow(0 10px 14px rgba(11,16,32,.12))}
.ph .rlink:focus-visible{outline:2px solid var(--blue);outline-offset:-4px;border-radius:20px 20px 0 0}
.ph .open{position:absolute;right:14px;bottom:10px;font-size:11px;font-weight:600;color:var(--ink-2);background:rgba(255,255,255,.82);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow-soft);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.ph .rlink:hover ~ .open{opacity:1;transform:none}
.ph .bl{left:14px;bottom:10px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2);background:rgba(255,255,255,.82);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow-soft);pointer-events:none;font-variant-numeric:tabular-nums}
.ph .bl i{font-style:normal;font-weight:500;color:var(--muted)}
.ph .bl .sw{width:8px;height:8px;border-radius:2px;background:#A3161F}

/* hierarchy: aligned numbers, the next action leads */
.qrow .hz,.stg .c,.facts b,.tstat b,.ring .v b,.qrow .no{font-variant-numeric:tabular-nums}
.qrow .hz{min-width:42px;text-align:right}
.act .pri{font-size:16px;font-weight:700}
.qh b{font-size:15px}

/* round 4: card advance */
.card{transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .34s cubic-bezier(.2,.8,.2,1),box-shadow .38s}
.card.out{transform:translateX(calc(var(--dir) * 115%)) translateY(-10px) rotate(calc(var(--dir) * 7deg))!important;opacity:0}
.card[data-d="0"] > *{opacity:1;transition:opacity .3s cubic-bezier(.2,.8,.2,1) .08s}
.card.rise .cb{animation:d50rise .4s cubic-bezier(.2,.8,.2,1) both}
.card.rise .ph svg{animation:d50roof .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes d50rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes d50roof{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.qrow{transition:background .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .3s}
.qrow.flash{animation:d50flash .7s cubic-bezier(.2,.8,.2,1)}
@keyframes d50flash{0%{background:color-mix(in srgb,var(--accent) 16%,#fff)}100%{background:var(--panel-2)}}
.ring .v b{display:inline-block}
.ring.tick .v b{animation:d50tick .35s cubic-bezier(.2,.8,.2,1)}
@keyframes d50tick{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.stop{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
/* the roof sits clear of the corner pills: below the top pills and above the bottom ones on a laptop; on a phone the
   photo band is short, so the roof keeps the full height and the pills keep the side corners instead */
.ph .rlink{inset:48px 20px 42px}
@media (max-width:640px){.ph .rlink{inset:12px 112px}}
@media (prefers-reduced-motion:reduce){
  .card,.card.out,.qrow,.ph .rlink svg,.card[data-d="0"] > *{transition:opacity .15s linear!important}
  .card.out{transform:none!important}
  .card.rise .cb,.card.rise .ph svg,.qrow.flash,.ring.tick .v b{animation:none!important}
  .ph .rlink:hover svg{transform:none}
}

/* v2: working Daily 50 (same look) */
.find{cursor:text}
.find input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.find input::placeholder{color:var(--muted)}
.find:focus-within{border-color:var(--edge);background:#fff}
.qnone{padding:14px 12px;font-size:12.5px;color:var(--muted);line-height:1.45}
.pline{padding:0 var(--g) 8px;font-size:12.5px;color:var(--muted);line-height:1.4}
.pline b{color:var(--ink);font-weight:600}
.addr h2 .hl{color:inherit;text-decoration:none;border-radius:6px}
.addr h2 .hl:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.addr h2 .hl:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* action bar (10-09): Text leads (opens the draft), Email second, then Skip; no calls from the app */
.act .ic{flex:none}
.alog{flex:1;display:grid;gap:8px;padding:4px 4px 2px;min-width:0}
.alog .aq{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.outc{display:flex;flex-wrap:wrap;gap:6px}
.act .outc button{height:38px;flex:1 1 auto;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.act .outc button:hover{border-color:var(--edge)}
.act .outc button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.adone{flex:1.2;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.35;min-width:0}
.adone .ic{width:16px;height:16px;color:var(--accent);flex:none}
.act .pri.nxt{flex:1}
/* desktop: one card, no stacked cards behind it */
@media (min-width:641px){
  .card{inset:0}
  .card[data-d="1"],.card[data-d="2"]{opacity:0;pointer-events:none;transform:translateY(14px) scale(.98)}
}
/* map pins: a bigger tap area without a bigger pin */
/* no position here: maplibre places each marker absolutely; a relative pin sat in flow and drifted down one pin-height per stop */
.stop::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.stop.added{border-style:dashed}
/* dialogs */
.dlg{border:0;padding:22px;border-radius:20px;background:#fff;color:var(--ink);width:min(440px,calc(100% - 28px));box-shadow:0 30px 60px -20px rgba(11,16,32,.4);font-family:var(--font)}
.dlg::backdrop{background:rgba(11,16,32,.28)}
.dlg h3{font-size:19px;font-weight:700;letter-spacing:-.02em}
.dlg .dsub{margin-top:3px;font-size:13px;color:var(--slate)}
.dlg .dlab{margin:16px 0 8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dgrid.slots{grid-template-columns:repeat(5,1fr)}
.dgrid button{min-height:44px;border-radius:12px;border:1px solid var(--hair);background:#fff;font-size:13px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.dgrid button small{font-size:11px;font-weight:500;color:var(--muted)}
.dgrid button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dgrid button.on small{color:rgba(255,255,255,.7)}
.dlg textarea{margin-top:14px;width:100%;border:1px solid var(--hair);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
.dlg .optin{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.45;color:var(--slate);background:var(--panel-2)}
.dlg .optin b{display:block;font-size:13.5px;color:var(--ink)}
.dlg .optin.yes{background:var(--accent-soft)}
.dlg .optin.yes b{color:var(--accent-ink)}
.dlg .draft{padding:12px 14px;border-radius:14px;border:1px solid var(--hair-2);font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dbtn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--hair);background:#fff;font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.dbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.dbtn.pri:hover{background:var(--accent-hi)}
/* undo toast */
.toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;box-shadow:0 14px 30px -12px rgba(11,16,32,.5);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 28px)}
.toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:36px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px}
@media (max-width:380px){ .facts small{font-size:10.5px;gap:4px} .facts div{padding:9px 8px} .act .skp{flex:.6} }
@media (max-width:640px){
  .pline{display:none}
  .act .outc button{height:44px;font-size:13.5px}
  .act .pri.nxt{height:58px}
  .ph .ex{height:44px;padding:0 14px}
  .mnext .go{height:44px}
  .sheet .sh button{width:44px;height:44px}
  .rsheet .rchips button{height:44px;padding:0 16px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .toast button{min-height:44px}
  /* sheets: solid white, padded, nothing renders on top */
  .sheet{background:#fff;isolation:isolate;overflow:hidden auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .rsheet .roofwrap{position:relative;overflow:hidden;background:#F3F5F8}
  .rsheet .rtab{background:#fff}
  .scrim{z-index:55}
}

/* Today v2 (Jack 10-08): Homes-screen layout language. Same panel radius (22), header pattern (h1 38/500, panel heads
   15/600 with an underline tab row), filter pills and type scale as c5-home, so Today and Homes read as one product. */
.app{grid-template-rows:64px auto minmax(0,1fr)}
.head{padding:22px var(--g) 18px;align-items:flex-end}
.hello h1{font-size:38px;font-weight:500;letter-spacing:-.03em;line-height:1.04;color:var(--ink)}
.main{grid-template-columns:300px minmax(400,480px) minmax(0,1fr);grid-template-columns:300px minmax(400px,480px) minmax(0,1fr);gap:20px}
.queue,.mapwrap,.card.paper{border-radius:22px}
.queue{border:0;box-shadow:0 24px 60px rgba(11,16,32,.10),0 1px 2px rgba(11,16,32,.05)}
.mapwrap{border:0;box-shadow:0 24px 60px rgba(11,16,32,.10),0 1px 2px rgba(11,16,32,.05)}
.ph{border-radius:22px 22px 0 0}
/* left panel head: tabs on the left, the count on the right */
.qh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 20px 0;border-bottom:1px solid var(--rule);margin:0 0 8px}
.qh small{font-size:12.5px;color:var(--muted);padding-bottom:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ltabs{display:flex;gap:2px}
.ltabs button{position:relative;height:38px;padding:0 8px;font-size:15px;font-weight:500;color:var(--slate);display:inline-flex;align-items:center;gap:6px;border-radius:8px 8px 0 0;transition:color .2s,background .2s;white-space:nowrap}
@media (hover:hover){ .ltabs button:hover{color:var(--ink);background:var(--panel-2)} }
.ltabs button.on{color:var(--ink);font-weight:600}
.ltabs button::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:transparent;transition:background .2s}
.ltabs button.on::after{background:var(--ink)}
.ltabs button i{font-style:normal;font-size:11px;font-weight:600;color:var(--slate);background:var(--panel-2);border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center}
.ltabs button.on i{background:var(--ink);color:#fff}
.ltabs button i[hidden]{display:none}
/* cards that slid off (done stops) or wait behind never take clicks: an off-screen card used to sit over the Up next rows */
.card.out,.card[data-d="3"],.card[data-d="x"]{pointer-events:none}
.lpane{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.lpane.on{display:flex}
.embed .queue .find{margin:0 12px 8px}
/* inbox */
.ifil{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--panel-2);margin:2px 12px 8px;flex:none;overflow-x:auto;scrollbar-width:none}
.ifil::-webkit-scrollbar{display:none}
.ifil button{height:30px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--slate);flex:1 0 auto;white-space:nowrap}
.ifil button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(11,16,32,.1)}
.ilist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--panel-3) transparent;padding:0 8px 10px;display:grid;gap:2px;align-content:start}
.irow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;padding:10px 10px;border-radius:12px;text-align:left;width:100%;transition:background .2s}
.irow:hover{background:var(--panel-2)}
.ich{display:grid;justify-items:center;gap:3px;padding-top:2px}
.ich .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);color:var(--ink-2)}
.ich .ic svg{width:16px;height:16px}
.ich b{font-size:10.5px;font-weight:600;color:var(--slate);letter-spacing:.01em}
.ich[data-ch="text"] .ic{background:#E3F2F9;color:#0D6C99}
.ich[data-ch="email"] .ic{background:#ECE9F7;color:#5B4BA8}
.ich[data-ch="call"] .ic{background:#F6EEDD;color:#8A5A00}
.ich[data-ch="booking"] .ic{background:var(--accent-soft);color:var(--accent-ink)}
.ibody{display:grid;gap:1px;min-width:0}
.itop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.iad{font-size:13.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itop time{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.iwho{font-size:12px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilast{font-size:12.5px;color:var(--ink-2);line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icount{color:var(--muted);font-size:11.5px;white-space:nowrap}
.inone{padding:14px 14px;font-size:13px;color:var(--muted);line-height:1.5}

<script>
const KEY = DK.rooferKey(), DATA = DK.dataKey(KEY);   // the roofer, and whose route is drawn (its own)
const R = DK.theme(KEY);
document.getElementById('me').textContent = R.rep[0];
const DSTATE = (DK.ROOFERS[DATA] || R).state || 'TX';   // state of the addresses on screen (the data's, not the brand's)
const I = DK.I, esc = RC.esc;
const phone = matchMedia('(max-width:640px)').matches;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let TOTAL = 0, LEFT = 0;   // the stops actually in today's queue (set by buildList), so the header, the cards and the footer agree
const showcase = R.storm.iso === RC.SHOWCASE;

// ---------- the list: today's Daily 50 (lib/rc-queue.js RC.daily), then homes added from the storm map ----------
// RC.daily() picks the day's 50 real homes (cadence follow-ups due first, then the homes most likely to say yes, scored over every house in the area, storm or not) and
// keeps the same 50 all day. Each home's roof comes from its own building outline (RealRoof.mapEntry). People and
// phones are sample; the owner comes from the private county roll when it is loaded (RC.owner), else "Owner not loaded".
const hash = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const OWNDATA = !!(R.ownData || (window.activeRoofer && activeRoofer().dataRoot));
// the roof-age rule (RC.roofEvidence, 10-26): a missing permit is "roof age unknown" outside the complete-permit cities
const roofAgeOf = (permit, year, city) => permit ? 'Reroof permit '+String(permit).slice(0,4) : RC.roofEvidence(city, year, null).text;
let QREADY = false, QERR = null, QDAY = '';
// no sample phone numbers (10-22): a home has a phone only when the rep added one (record > Add phone) or a record holds one
function specFor(gi, seed){
  const got = gi!=null && window.RealRoof ? RealRoof.mapCached(gi) : null;
  if (got === undefined) return Object.assign(RealRoof.none(seed), { loading:true, label:'Loading the outline' });
  return got ? RealRoof.spec(got, { seed }) : RealRoof.none(seed);
}
function withSpec(h){
  h.spec = specFor(h.gi, h.seed); h.M = DK.roofMeasure(h.spec);
  const real = h.spec && !h.spec.none;
  h.sq = real ? h.M.squares : (h.pick && h.pick.squares != null ? Math.round(h.pick.squares*10)/10 : null);
  h.pitch = real ? h.M.predominant || null : null; h.pitchMeasured = !!(h.spec && h.spec.pitchMeasured);
  return h;
}
function pickHomes(){
  const picks = RC.daily();
  QDAY = new Date().toDateString();
  return picks.map((p,i)=>{
    const seen = RC.recall(p.id) || {}, line = p.street || (p.address ? p.address.split(',')[0] : null) || seen.addr || 'Home on file';
    const h = { id:p.id, n:i+1, pick:p, addr:line, short:DK.short(line), street:line, loc: isFinite(p.lon) && isFinite(p.lat) ? [+p.lon, +p.lat] : null,
      city:p.city || seen.city || R.city, zip:p.zip || seen.zip || '', hail: p.hail!=null ? (+p.hail).toFixed(2) : null,
      year:p.yearBuilt || null, permit:p.permit || null, roofAge:roofAgeOf(p.permit, p.yearBuilt, p.city || seen.city || R.city), storm:p.storm, gi:p.gi, subdivision:p.subdivision || null,
      seed:900 + hash(p.id)%5000, person:null, phone:seen.phone && !/5550\d{3}$/.test(String(seen.phone)) ? seen.phone : null,
      // opted in / past customer only when a record on this device says so (the check page, the Home screen); the 50 are cold
      optin:!!(seen.optin || seen.optIn), past:!!(seen.past || seen.pastCustomer), textConsent:!!seen.textConsent, added:false };
    return withSpec(h);
  });
}
// where an added home came from: the storm map, Ask Nimbus, or a neighbor of a home on the record (10-19)
const addedLine = h => h.addedFrom==='neighbors' ? 'Neighbor, same storm' : h.addedFrom==='ask nimbus' ? 'Added from Ask Nimbus' : 'Added from the storm map';
function addedHomes(start){
  return (RC.addedOpen ? RC.addedOpen() : RC.added()).map((a,k)=>{
    const seen = RC.recall(a.id) || {}, seed = 900 + hash(a.id)%5000, spec = RealRoof.none(seed), M = DK.roofMeasure(spec);
    const hail = a.hail != null ? (+a.hail).toFixed(2) : seen.hail != null ? (+seen.hail).toFixed(2) : null;
    const addr = a.addr || seen.addr || 'Home from the storm map';
    return { id:a.id, n:start+k+1, addr, short:DK.short(addr), street:'', loc:[+a.lon, +a.lat], hail, year:seen.year||null, permit:null,
      roofAge:seen.roofAge||'Checking the county record', sq:M.squares, pitch:M.predominant, spec, M, seed,
      person:seen.person || null, phone:seen.phone || null, optin:!!seen.optin, past:!!seen.past, textConsent:!!seen.textConsent, added:true, addedFrom:a.from || 'storm map',
      city:seen.city || a.county || R.city, zip:seen.zip || '' };
  });
}
let HOMES = [];
function buildList(){
  const keep = {}; HOMES.forEach(h=>{ if (h.owner) keep[h.id] = h.owner; });
  // an opted-out home leaves today's list (RC.daily keeps it as closed; the Inbox's Opted out filter still has it)
  const base = QREADY ? pickHomes().filter(h=>!(h.pick.status==='closed' && h.pick.closedBy==='opted out')) : [];
  HOMES = base.concat(addedHomes(base.length).filter(a=>!base.some(b=>b.id===a.id) && isFinite(a.loc[0]) && isFinite(a.loc[1])));
  HOMES.forEach(h=>{ if (keep[h.id]) h.owner = keep[h.id]; });
  TOTAL = QREADY ? RC.daily().length + HOMES.filter(h=>h.added).length : 0; if (QREADY) RC.queue(TOTAL);
  HOMES.forEach(h=>{ const was = RC.recall(h.id) || {};
    // remember once (each write is a storage event in every frame): the facts Home and the Inbox read back
    if (was.addr === h.addr && was.gi === (h.gi!=null?h.gi:null) && was.phone === h.phone && was.lon === (h.loc?h.loc[0]:null)) return;
    RC.remember({ id:h.id, gi:h.gi!=null?h.gi:null, addr:h.addr, city:h.city, zip:h.zip, hail:hailOk(h.hail)?+h.hail:null, year:h.year, permit:h.permit||null, roofAge:h.roofAge||null,
      phone:h.phone, storm:h.storm||null, lon:h.loc?h.loc[0]:null, lat:h.loc?h.loc[1]:null, sample:true, from:h.added?'storm map':'daily50' }); });
}
// roofs: every home's own outline, the open stop first, then the rest of the list (tiles are shared, so this is quick)
let roofQ = 0;
function loadRoofs(){
  if (!window.RealRoof || !RealRoof.mapEntry) return;
  const want = HOMES.filter(h=>!h.added && h.gi!=null && h.loc && RealRoof.mapCached(h.gi) === undefined);
  const first = HOMES[cur] && want.includes(HOMES[cur]) ? [HOMES[cur]] : [];
  const one = h => RealRoof.mapEntry(h.gi, h.loc[0], h.loc[1]).then(()=>{ const i = HOMES.indexOf(h); if (i < 0) return; withSpec(h); paintRoof(i); });
  Promise.all(first.map(one)).then(()=>Promise.all(want.filter(h=>!first.includes(h)).map(one))).then(()=>{ if (!roofQ++) renderQueue(false); }).catch(()=>{});
}
// ---------- skips (this device; Undo removes them) ----------
const SK = 'rc.t.d50skip';
const skips = () => { try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch(e){ return {}; } };
const setSkips = m => { try { localStorage.setItem(SK, JSON.stringify(m)); } catch(e){} };
const today = iso => new Date(iso).toDateString() === new Date().toDateString();
const skippedToday = id => { const s = skips()[id]; return s && today(s.at) ? s : null; };
// reached today on this device (a text or an email draft opened): the Daily 50 counts that home as done
let RTSET = null;
RC.on(()=>{ RTSET = null; });
const reachedToday = id => { if (!RTSET){ const d = new Date().toDateString(); RTSET = new Set(RC.activity().filter(a=>a.dir==='out' && (a.ch==='text'||a.ch==='email') && new Date(a.at).toDateString()===d).map(a=>a.id)); RTSET.day = d; }
  if (RTSET.day !== new Date().toDateString()){ RTSET = null; return reachedToday(id); } return RTSET.has(id); };
const isDone = h => reachedToday(h.id) || !!skippedToday(h.id) || RC.stage(h.id) === 'won' || !!(RC.pipeline()[h.id]||{}).archived;
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).toLowerCase();
// can a text go to this home right now (opt-out, phone on file, the roofer's texting hours: RC.textWindow)
const canTextH = h => RC.canText(h.id, h.phone || null);

// ---------- header ----------
let cur = 0;
const actState = {};   // id -> 'skip' | {done:'...'}
function stageCounts(){ const c = {}; RC.STAGES.forEach(s=>c[s[0]]=0); HOMES.forEach(h=>{ const s = RC.stage(h.id); c[s] = (c[s]||0)+1; }); return c; }
function renderHeader(){
  // the queue's own count: stops not yet texted, emailed, skipped or won today (works for any size of list)
  LEFT = HOMES.filter(h=>!isDone(h)).length;
  paintCount();
  document.getElementById('greet').textContent = RC.greeting();
  const c = stageCounts(), booked = c.inspection;
